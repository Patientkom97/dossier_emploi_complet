<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Ajira – Administration</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <div id="adm">
    <div id="aLogin" class="card">
      <h1>Administration Ajira</h1>
      <label for="ae">E-mail administrateur</label><input id="ae" type="email" autocomplete="username">
      <label for="ap">Mot de passe</label><input id="ap" type="password" autocomplete="current-password">
      <button class="btn" id="agoBtn" style="width:100%">Se connecter</button>
      <p id="aMsg" class="hint" role="status"></p>
    </div>
    <div id="aApp" hidden>
      <div class="bar">
        <h1>Clés d'accès Premium</h1><span id="aWho" class="hint"></span><button class="btn alt"
          id="aOut">Déconnexion</button>
      </div>
      <div class="card">
        <h2>Nouvelle clé</h2>
        <div class="row">
          <div><label for="aj">Durée</label><select id="aj">
              <option value="30">30 jours (1 mois)</option>
              <option value="90">90 jours (3 mois)</option>
              <option value="180">180 jours (6 mois)</option>
              <option value="365">365 jours (1 an)</option>
            </select></div>
          <div><label for="an">Personne / référence du paiement</label><input id="an"
              placeholder="ex. Marie K. – Airtel réf. 123456"></div>
        </div>
        <button class="btn" id="aGen">Générer la clé</button>
        <div id="aOutBox" hidden>
          <div class="code" id="aCode"></div>
          <button class="btn alt" id="aCopy">Copier la clé</button> <button class="btn alt" id="aCopyMsg">Copier le
            message WhatsApp</button>
          <p id="aCopied" class="hint" role="status"></p>
        </div>
      </div>
      <div class="card">
        <h2>Clés générées</h2>
        <div class="hint" id="aStat"></div>
        <div style="overflow:auto">
          <table id="aTab">
            <thead>
              <tr>
                <th>Clé</th>
                <th>Durée</th>
                <th>Note</th>
                <th>Créée</th>
                <th>Statut</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
